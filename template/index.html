<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Prediction</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #253858;
        }

        p {
            color: #555;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4169e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #274bb5;
        }

        #result {
            margin-top: 20px;
            font-size: 16px;
            color: #253858;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather Prediction</h1>
        <p>Enter your city to check the current weather.</p>

        <form action="/weather" method="POST">
            <input
                type="text"
                name="city"
                placeholder="Enter city name"
                required
            >
            <button type="submit">Check Weather</button>
        </form>

        <div id="result">
            {% if error %}
                <p>{{ error }}</p>
            {% endif %}

            {% if weather %}
                <h2>{{ weather.city }}</h2>
                <p>🌡️ Temperature: {{ weather.temperature }}°C</p>
                <p>☁️ Condition: {{ weather.description }}</p>
                <p>💧 Humidity: {{ weather.humidity }}%</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
